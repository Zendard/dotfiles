$terminal = kitty
$fileManager = nautilus
$menu = anyrun

$mainMod = SUPER

# General
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive, 
bind = $mainMod, M, exit, 
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, F, togglefloating, 
bind = $mainMod, R, exec, $menu
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, space, togglesplit, # dwindle

# hyprsunset 
bind = $mainMod, N, exec, hyprctl hyprsunset temperature +500
bind = $mainMod, B, exec, hyprctl hyprsunset temperature -500

# Media controls
bind = , XF86AudioPause, exec, playerctl play-pause
bind = , XF86AudioForward, exec, playerctl next 
bind = , XF86AudioRewind, exec, playerctl previous

# Volume controls
bind = , XF86AudioRaiseVolume, exec, amixer sset "Master" 5%+ 
bind = , XF86AudioLowerVolume, exec, amixer sset "Master" 5%- 
bind = , XF86AudioMute, exec, amixer sset "Master" toggle 

# Microphone controls
bind = , XF86AudioMicMute, exec, amixer sset "Capture" toggle 

# Brightness controls
bind = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bind = , XF86Display, exec, systemctl suspend

# Power button
bind = $mainMod, XF86Start, exec, systemctl poweroff

# clipse
windowrule {
  name=clipse
  match:class = clipse
  float = on
  size = 622 653
}
bind = $mainMod, V, exec, $terminal --class clipse -e clipse

# Screenshot
bind = , Print, exec, grim -g "$(slurp -d)" - | wl-copy

# Move focus
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Move window
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d

# Resize window
bind = $mainMod ALT, H, resizeactive, -30 0
bind = $mainMod ALT, L, resizeactive, 30 0
bind = $mainMod ALT, K, resizeactive, 0 30
bind = $mainMod ALT, J, resizeactive, 0 -30

# Switch workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scroll through existing workspaces
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Minimize window
bind = $mainMod, U, togglespecialworkspace, minimize
bind = $mainMod, S, movetoworkspace, special:minimize
