# See https://wiki.hyprland.org/Configuring/Monitors/
monitor=,preferred,auto,1.2
# monitor=,preferred,auto,1


# See https://wiki.hyprland.org/Configuring/Keywords/ for more
exec-once = waybar
exec-once = kdeconnect-indicator
exec-once = kdeconnectd
exec-once = clipse -listen
exec-once = nextcloud
exec-once = anyrun daemon

# exec = gsettings set org.gnome.desktop.interface gtk-theme "adwaita-dark"   # for GTK3 apps
# exec = gsettings set org.gnome.desktop.interface color-scheme "prefer-dark"   # for GTK4 apps
env = QT_STYLE_OVERRIDE,Adwaita-dark
env = QT_QPA_PLATFORMTHEME,qt6ct   # for Qt apps
# env = QT_SCALE_FACTOR,0.47

# Source a file (multi-file configs)
source = ~/.config/hypr/hypr-keybinds.conf

# Some default env vars.
env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt6ct

# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    touchpad {
        natural_scroll = yes
    }

    sensitivity = 0 # -1.0 to 1.0, 0 means no modification.
}

general {
  # See https://wiki.hyprland.org/Configuring/Variables/ for more
  monitor = HDMI-A-1, 1920x1080@60, 1920x0, 1
  monitor = DP-3, 1920x1080@144, 0x0, 1

  gaps_in = 5
  gaps_out = 10
  border_size = 3
  col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
  col.inactive_border = rgba(595959aa)

  layout = dwindle

  # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
  allow_tearing = false
}

decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

  rounding = 10
  active_opacity=1
  inactive_opacity=0.9
    
  #blur {
  #      enabled = true
  #      size = 3
  #      passes = 1
  #  }
}

animations {
    enabled = yes

    # Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

misc {
  # disable_hyprland_logo = yes
  force_default_wallpaper = 0
}

dwindle {
    pseudotile = yes # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = yes # you probably want this
}

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

xwayland {
  force_zero_scaling = true
}

windowrule {
  name = suppres-maximize
  match:class = .*
  suppress_event = maximize
}
windowrule {
  name = minimize-vesktop
  match:class = vesktop
  workspace = special:minimize
} 
